services:
  streamer:
    build:
      context: .
      target: runtime
    image: telegram-stream:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - telegram-state:/data
      - ./media:/media:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "telegram-stream", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telegram-state:
